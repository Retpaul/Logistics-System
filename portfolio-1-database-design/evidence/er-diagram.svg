<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><rect width="100%" height="100%" fill="#f8fafc"/><text x="35" y="45" font-family="Arial,sans-serif" font-size="30" fill="#172554">EcoDispatch — relational design: 13 models</text><text x="35" y="75" font-family="Arial,sans-serif" font-size="17" fill="#172554">Committed Prisma schema + SQL migrations; design view, not proof of local migration rollout.</text><text x="35" y="108" font-family="Arial,sans-serif" font-size="17" fill="#172554">Parent (1) → child (0..many), except User → Rider (0..1). Optional child links are labelled.</text><rect x="35" y="145" width="370" height="115" rx="8" fill="white" stroke="#94a3b8"/><text x="47" y="171" font-family="Arial,sans-serif" font-size="21" fill="#172554">Tenant</text><text x="47" y="198" font-family="Arial,sans-serif" font-size="15" fill="#172554">id PK</text><text x="47" y="221" font-family="Arial,sans-serif" font-size="15" fill="#172554"></text><rect x="425" y="145" width="370" height="115" rx="8" fill="white" stroke="#94a3b8"/><text x="437" y="171" font-family="Arial,sans-serif" font-size="21" fill="#172554">User</text><text x="437" y="198" font-family="Arial,sans-serif" font-size="15" fill="#172554">id PK, tenantId</text><text x="437" y="221" font-family="Arial,sans-serif" font-size="15" fill="#172554"></text><rect x="815" y="145" width="370" height="115" rx="8" fill="white" stroke="#94a3b8"/><text x="827" y="171" font-family="Arial,sans-serif" font-size="21" fill="#172554">RefreshToken</text><text x="827" y="198" font-family="Arial,sans-serif" font-size="15" fill="#172554">id PK, tenantId, userId</text><text x="827" y="221" font-family="Arial,sans-serif" font-size="15" fill="#172554">familyId</text><rect x="1205" y="145" width="370" height="115" rx="8" fill="white" stroke="#94a3b8"/><text x="1217" y="171" font-family="Arial,sans-serif" font-size="21" fill="#172554">Rider</text><text x="1217" y="198" font-family="Arial,sans-serif" font-size="15" fill="#172554">id PK, tenantId, userId</text><text x="1217" y="221" font-family="Arial,sans-serif" font-size="15" fill="#172554"></text><rect x="35" y="280" width="370" height="115" rx="8" fill="white" stroke="#94a3b8"/><text x="47" y="306" font-family="Arial,sans-serif" font-size="21" fill="#172554">Bike</text><text x="47" y="333" font-family="Arial,sans-serif" font-size="15" fill="#172554">id PK, tenantId</text><text x="47" y="356" font-family="Arial,sans-serif" font-size="15" fill="#172554"></text><rect x="425" y="280" width="370" height="115" rx="8" fill="white" stroke="#94a3b8"/><text x="437" y="306" font-family="Arial,sans-serif" font-size="21" fill="#172554">Customer</text><text x="437" y="333" font-family="Arial,sans-serif" font-size="15" fill="#172554">id PK, tenantId</text><text x="437" y="356" font-family="Arial,sans-serif" font-size="15" fill="#172554"></text><rect x="815" y="280" width="370" height="115" rx="8" fill="white" stroke="#94a3b8"/><text x="827" y="306" font-family="Arial,sans-serif" font-size="21" fill="#172554">QrCode</text><text x="827" y="333" font-family="Arial,sans-serif" font-size="15" fill="#172554">id PK, tenantId</text><text x="827" y="356" font-family="Arial,sans-serif" font-size="15" fill="#172554"></text><rect x="1205" y="280" width="370" height="115" rx="8" fill="white" stroke="#94a3b8"/><text x="1217" y="306" font-family="Arial,sans-serif" font-size="21" fill="#172554">QrScan</text><text x="1217" y="333" font-family="Arial,sans-serif" font-size="15" fill="#172554">id PK, qrCodeId</text><text x="1217" y="356" font-family="Arial,sans-serif" font-size="15" fill="#172554"></text><rect x="35" y="415" width="370" height="115" rx="8" fill="white" stroke="#94a3b8"/><text x="47" y="441" font-family="Arial,sans-serif" font-size="21" fill="#172554">Order</text><text x="47" y="468" font-family="Arial,sans-serif" font-size="15" fill="#172554">id PK, tenantId, customerId</text><text x="47" y="491" font-family="Arial,sans-serif" font-size="15" fill="#172554">riderId, bikeId, qrCodeId</text><rect x="425" y="415" width="370" height="115" rx="8" fill="white" stroke="#94a3b8"/><text x="437" y="441" font-family="Arial,sans-serif" font-size="21" fill="#172554">StoredFile</text><text x="437" y="468" font-family="Arial,sans-serif" font-size="15" fill="#172554">id PK, tenantId, userId</text><text x="437" y="491" font-family="Arial,sans-serif" font-size="15" fill="#172554"></text><rect x="815" y="415" width="370" height="115" rx="8" fill="white" stroke="#94a3b8"/><text x="827" y="441" font-family="Arial,sans-serif" font-size="21" fill="#172554">OrderEvent</text><text x="827" y="468" font-family="Arial,sans-serif" font-size="15" fill="#172554">id PK, orderId</text><text x="827" y="491" font-family="Arial,sans-serif" font-size="15" fill="#172554"></text><rect x="1205" y="415" width="370" height="115" rx="8" fill="white" stroke="#94a3b8"/><text x="1217" y="441" font-family="Arial,sans-serif" font-size="21" fill="#172554">TrackingPoint</text><text x="1217" y="468" font-family="Arial,sans-serif" font-size="15" fill="#172554">id PK, orderId</text><text x="1217" y="491" font-family="Arial,sans-serif" font-size="15" fill="#172554"></text><rect x="35" y="550" width="370" height="115" rx="8" fill="white" stroke="#94a3b8"/><text x="47" y="576" font-family="Arial,sans-serif" font-size="21" fill="#172554">Payment</text><text x="47" y="603" font-family="Arial,sans-serif" font-size="15" fill="#172554">id PK, orderId</text><text x="47" y="626" font-family="Arial,sans-serif" font-size="15" fill="#172554"></text><text x="35" y="725" font-family="Arial,sans-serif" font-size="23" fill="#172554">Foreign-key relationships (composite links include tenantId)</text><text x="35" y="763" font-family="Arial,sans-serif" font-size="16" fill="#172554">Tenant → User: tenantId</text><text x="35" y="794" font-family="Arial,sans-serif" font-size="16" fill="#172554">Tenant → Rider: tenantId</text><text x="35" y="825" font-family="Arial,sans-serif" font-size="16" fill="#172554">Tenant → Bike: tenantId</text><text x="35" y="856" font-family="Arial,sans-serif" font-size="16" fill="#172554">Tenant → Customer: tenantId</text><text x="35" y="887" font-family="Arial,sans-serif" font-size="16" fill="#172554">Tenant → QrCode: tenantId</text><text x="35" y="918" font-family="Arial,sans-serif" font-size="16" fill="#172554">Tenant → Order: tenantId</text><text x="35" y="949" font-family="Arial,sans-serif" font-size="16" fill="#172554">User → RefreshToken: tenantId,userId; DELETE CASCADE</text><text x="35" y="980" font-family="Arial,sans-serif" font-size="16" fill="#172554">User → Rider: tenantId,userId; optional profile</text><text x="35" y="1011" font-family="Arial,sans-serif" font-size="16" fill="#172554">User → StoredFile: tenantId,userId</text><text x="825" y="763" font-family="Arial,sans-serif" font-size="16" fill="#172554">Customer → Order: tenantId,customerId</text><text x="825" y="794" font-family="Arial,sans-serif" font-size="16" fill="#172554">Rider → Order: tenantId,riderId; optional</text><text x="825" y="825" font-family="Arial,sans-serif" font-size="16" fill="#172554">Bike → Order: tenantId,bikeId; optional</text><text x="825" y="856" font-family="Arial,sans-serif" font-size="16" fill="#172554">QrCode → Order: tenantId,qrCodeId; optional</text><text x="825" y="887" font-family="Arial,sans-serif" font-size="16" fill="#172554">QrCode → QrScan: qrCodeId</text><text x="825" y="918" font-family="Arial,sans-serif" font-size="16" fill="#172554">Order → OrderEvent: orderId</text><text x="825" y="949" font-family="Arial,sans-serif" font-size="16" fill="#172554">Order → TrackingPoint: orderId</text><text x="825" y="980" font-family="Arial,sans-serif" font-size="16" fill="#172554">Order → Payment: orderId</text><text x="35" y="1078" font-family="Arial,sans-serif" font-size="16" fill="#172554">Order.proofFileId is a logical file reference only: no SQL foreign key. Other deletes RESTRICT.</text><text x="35" y="1103" font-family="Arial,sans-serif" font-size="16" fill="#172554">Full fields, nullability and types: prisma/schema.prisma. SQL-only checks/indexes: prisma/migrations/.</text></svg>
